<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Evu 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f1ea;          /* teplá krémová */
    --card: #fffaf5;
    --text: #4a3f3a;
    --muted: #8c7d74;
    --accent: #c98f86;      /* jemná pudrová růžová */
    --accent-soft: #ecd5cf;
    --sage: #a7b8a1;        /* šalvějová zelená */
    --line: #e8ddd3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    background-image:
      radial-gradient(circle at 15% 10%, #f3e1da 0, transparent 40%),
      radial-gradient(circle at 85% 90%, #e3eadf 0, transparent 40%);
    background-attachment: fixed;
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 80px; }

  header { text-align: center; margin-bottom: 48px; }
  .eyebrow {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(40px, 9vw, 60px); line-height: 1.05;
  }
  h1 span { color: var(--accent); font-style: italic; display: block; }
  .subtitle { margin-top: 14px; color: var(--muted); font-size: 17px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 24px;
    margin-bottom: 24px;
    box-shadow: 0 10px 30px -18px rgba(120, 90, 70, .35);
    text-align: center;
  }
  .card h2 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400;
    font-size: 22px; margin-bottom: 4px;
  }
  .card .when { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

  .countdown { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .unit {
    min-width: 72px; padding: 12px 8px;
    background: var(--bg); border-radius: 14px;
  }
  .num {
    display: block; font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 34px; font-weight: 600; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .done-msg {
    font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; color: var(--accent);
  }

  /* zamčený program */
  .locked {
    position: relative; overflow: hidden;
  }
  .lock-icon {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--accent-soft);
    display: grid; place-items: center; font-size: 24px;
  }
  .blur-lines { margin-top: 24px; display: grid; gap: 10px; filter: blur(5px); opacity: .55; user-select: none; }
  .blur-lines div { height: 14px; border-radius: 7px; background: var(--line); }
  .blur-lines div:nth-child(1) { width: 80%; margin: 0 auto; }
  .blur-lines div:nth-child(2) { width: 60%; margin: 0 auto; }
  .blur-lines div:nth-child(3) { width: 70%; margin: 0 auto; }

  /* odkrytý program */
  .program { text-align: left; }
  .program h2 { text-align: center; margin-bottom: 24px; }
  .timeline { list-style: none; position: relative; padding-left: 28px; }
  .timeline::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px;
    width: 2px; background: var(--accent-soft);
  }
  .timeline li { position: relative; margin-bottom: 26px; opacity: 0; transform: translateY(8px); animation: rise .6s forwards; }
  .timeline li::before {
    content: ""; position: absolute; left: -26px; top: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--accent);
  }
  .timeline .time { font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: .05em; }
  .timeline .title { font-family: "Cormorant Garamond", Georgia, serif; font-size: 20px; }
  .timeline .desc { color: var(--muted); font-size: 15px; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .reveal { animation: fadeIn .8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  .more { text-align: center; margin-top: 8px; }
  .btn {
    display: inline-block; text-decoration: none; padding: 12px 22px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600; transition: transform .2s, background .2s;
  }
  .btn:hover { background: #b97d74; transform: translateY(-1px); }

  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 40px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Pro Evu 💌</p>
    <h1>Nedělní odpoledne <span>s tebou</span></h1>
    <p class="subtitle">Tady najdeš, co nás čeká. Jen si chvíli počkáš 🙂</p>
  </header>

  <!-- Odpočet do rande -->
  <section class="card">
    <h2>Do setkání zbývá</h2>
    <p class="when">neděle v 16:00</p>
    <div class="countdown" id="cd-date"></div>
  </section>

  <!-- Program: zamčený / odkrytý -->
  <section class="card locked" id="program-locked">
    <div class="lock-icon">🔒</div>
    <h2>Program je zatím tajný</h2>
    <p class="when">odkryje se v neděli ve 12:00</p>
    <div class="countdown" id="cd-reveal"></div>
    <div class="blur-lines" aria-hidden="true"><div></div><div></div><div></div></div>
  </section>

  <section class="card program hidden" id="program-open">
    <h2>Náš program</h2>
    <ul class="timeline" id="timeline"></ul>
    <div class="more"><a class="btn" id="more-link" href="cesta.html">Kudy pojedeme a co uvidíme →</a></div>
  </section>

  <footer>Těším se ✨</footer>
</main>

<script>
  // ===== NASTAVENÍ =====
  const DATE_START = new Date("2026-11-15T16:00:00+01:00"); // začátek rande
  const REVEAL_AT  = new Date("2026-11-15T12:00:00+01:00"); // odkrytí programu

  // Program doplníme později. Bude uložený zakódovaně,
  // aby si ho nešlo přečíst ve zdrojovém kódu stránky.
  const PROGRAM_ENCODED = "W3sidGltZSI6ICIxNjowMCIsICJ0aXRsZSI6ICJWeXp2ZWRudSB0xJsgdSB0ZWJlIiwgImRlc2MiOiAiUMWZaWplZHUgcHJvIHRlYmUgYSB2eXJhesOtbWUgZG8gRG9sbsOtIG9ibGFzdGkgVsOtdGtvdmljZS4ifSwgeyJ0aW1lIjogInBvdG9tIiwgInRpdGxlIjogIkRvbG7DrSBvYmxhc3QgVsOtdGtvdmljZSIsICJkZXNjIjogIktvbWVudG92YW7DoSBwcm9obMOtZGthLCBwcsWvdm9kY2VtIGJ1ZHUgasOhLiBQxZlpcHJhdiBzZSBuYSBww6FyIGhpc3RvcmVrIG8gdnlzb2vDvWNoIHBlY8OtY2guIn0sIHsidGltZSI6ICIxNzowMCIsICJ0aXRsZSI6ICJCb2x0IENhZsOpIG5hIEJvbHQgVG93ZXIiLCAiZGVzYyI6ICJLw6F2YSBuZWJvIMSNYWogYSBrIHRvbXUgdsO9aGxlZCBuYSB2ZcSNZXJuw60gT3N0cmF2dS4ifSwgeyJ0aW1lIjogIjE5OjAwIiwgInRpdGxlIjogIkRpdmFkbG86IFBlcm7DrWvDocWZIiwgImRlc2MiOiAiUMWZZXN1bmVtZSBzZSBkbyBjZW50cmEgT3N0cmF2eSBhIHZlxI1lciB6YWtvbsSNw61tZSB2ZSBTdHVkaXUgRy4ifV0=";

  // ===== LOGIKA =====
  function decodeProgram() {
    if (!PROGRAM_ENCODED) {
      return [{ time: "", title: "Program brzy doplníme", desc: "" }];
    }
    try {
      const bytes = Uint8Array.from(atob(PROGRAM_ENCODED), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return []; }
  }

  function renderUnits(el, ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const parts = [
      [Math.floor(s / 86400), "dní"],
      [Math.floor(s % 86400 / 3600), "hodin"],
      [Math.floor(s % 3600 / 60), "minut"],
      [s % 60, "sekund"],
    ];
    el.innerHTML = parts.map(([n, l]) =>
      `<div class="unit"><span class="num">${String(n).padStart(2, "0")}</span><span class="lbl">${l}</span></div>`
    ).join("");
  }

  function showProgram() {
    const list = document.getElementById("timeline");
    list.innerHTML = decodeProgram().map((item, i) => `
      <li style="animation-delay:${i * 0.15}s">
        ${item.time ? `<div class="time">${item.time}</div>` : ""}
        <div class="title">${item.title}</div>
        ${item.desc ? `<div class="desc">${item.desc}</div>` : ""}
      </li>`).join("");
    document.getElementById("program-locked").classList.add("hidden");
    if (preview) document.getElementById("more-link").href = "cesta.html?nahled";
    const open = document.getElementById("program-open");
    open.classList.remove("hidden");
    open.classList.add("reveal");
  }

  // ?nahled v adrese = ukáže program hned (jen pro tebe na kontrolu)
  const preview = new URLSearchParams(location.search).has("nahled");
  let revealed = false;

  function tick() {
    const now = Date.now();

    const toDate = DATE_START - now;
    const cdDate = document.getElementById("cd-date");
    if (toDate > 0) renderUnits(cdDate, toDate);
    else cdDate.innerHTML = `<p class="done-msg">Je to tady 💛</p>`;

    if (!revealed && (preview || now >= REVEAL_AT)) {
      revealed = true;
      showProgram();
    } else if (!revealed) {
      renderUnits(document.getElementById("cd-reveal"), REVEAL_AT - now);
    }
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
